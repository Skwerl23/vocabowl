<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexicount - Vocabulary Size Test</title>
<style>
:root{
  --bg:#ffffff;--fg:#374151;--muted:#6b7280;--soft:#f3f4f6;--line:#e5e7eb;
  --green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--blue-d:#1899d6;
  --red:#ff4b4b;--red-d:#ea2b2b;--yellow:#ffc800;--card:#ffffff;
  --good-bg:#e7f8d4;--bad-bg:#ffe1e1;--sel-bg:#dff3fd;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#131f24;--fg:#e5e7eb;--muted:#9ca3af;--soft:#1f2c33;--line:#37464f;--card:#1a282f;
  --good-bg:#233a14;--bad-bg:#4a1f1f;--sel-bg:#12384d}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:520px;padding:24px 20px;flex:1;display:flex;flex-direction:column}
.center{align-items:center;justify-content:center;text-align:center}
h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:8px 0}
h2{font-size:26px;font-weight:800;margin:0 0 12px}
.badge{display:inline-block;background:#fef9c3;color:#854d0e;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:16px}
.logo{font-size:84px;line-height:1;margin-bottom:8px}
p.lead{color:var(--muted);font-weight:600;max-width:320px;line-height:1.6;margin:12px auto 28px}
.btn{font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border:0;border-bottom:4px solid var(--green-d);background:var(--green);color:#fff;padding:13px 22px;border-radius:16px;cursor:pointer;width:100%;font-size:15px}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red);border-bottom-color:var(--red-d)}
.btn.sec{background:var(--card);color:var(--blue);border:2px solid var(--line);border-bottom-width:4px}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:800;cursor:pointer;padding:12px;margin-top:6px}
.link:hover{text-decoration:underline}
.stats{display:flex;gap:12px;margin:0 0 24px;width:100%}
.stat{flex:1;border:2px solid var(--line);border-radius:14px;padding:8px;background:var(--soft)}
.stat small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pill{background:var(--soft);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:99px}
.count{color:var(--green);font-weight:800;font-size:14px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.word{background:var(--sel-bg);border:2px solid var(--blue);border-radius:18px;padding:22px 12px;text-align:center;font-size:32px;font-weight:800;margin:10px 0 22px;word-break:break-word}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;cursor:pointer;font-size:16px}
.opt:hover:not(:disabled){background:var(--soft)}
.opt.sel{background:var(--sel-bg);border-color:var(--blue)}
.opt.good{background:var(--good-bg);border-color:var(--green)}
.opt.bad{background:var(--bad-bg);border-color:var(--red)}
.opt.dim{opacity:.5}
.foot{margin-top:auto;padding-top:20px}
.slot{height:68px;display:flex;align-items:center;justify-content:center;margin-top:8px}
.slot .link{margin:0}
.fb{width:100%;height:100%;border-radius:14px;padding:6px 14px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.fb.good{background:var(--good-bg)}.fb.bad{background:var(--bad-bg)}.fb.skip{background:var(--soft)}
.fb b{display:block;font-size:17px;line-height:1.2}
.fb span{display:block;margin-top:2px;font-weight:600;font-size:13px;line-height:1.3}
.card{width:100%;border:2px solid var(--line);border-bottom-width:8px;border-radius:24px;overflow:hidden;background:var(--card);margin-bottom:18px;text-align:center}
.hero{background:var(--blue);color:#fff;padding:24px 16px}
.hero small{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hero .big{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .nb{display:inline-block;background:var(--yellow);color:#713f12;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;margin-bottom:8px}
.body{padding:20px}
.verdict{font-style:italic;font-weight:700;font-size:18px;line-height:1.4;margin:0 0 18px}
.break{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.break h3{margin:0 0 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;font-size:13px;margin:8px 0;font-weight:700}
.row .n{width:84px}.row .t{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.row .t i{display:block;height:100%;background:var(--green)}
.row .v{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);width:46px;text-align:right}
.credit{font-size:11px;line-height:1.5;color:var(--muted);font-weight:600;max-width:460px;margin:8px auto 0;padding:16px 20px 28px;text-align:center;border-top:1px solid var(--line);width:100%}
.credit p{margin:0 0 6px}
.credit a{color:var(--blue)}
.note{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--card);color:var(--fg);border-radius:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.sheet h3{margin:0 0 10px;font-size:20px}
.sheet h4{margin:18px 0 6px}
.sheet p,.sheet li{font-size:14px;line-height:1.6;color:var(--muted);font-weight:600}
.sheet ul{padding-left:18px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet td{padding:6px 8px;border-bottom:1px solid var(--line)}
.sheet td:last-child{text-align:right;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ---------- Configuration ---------- */
// Each band is a slice of the frequency-ranked vocabulary. size = number of words the band represents.
const LEVELS = [
  { name: "Core",         desc: "Everyday words",        size: 3000  },  // ranks 1 - 3,000
  { name: "Intermediate", desc: "School and work",       size: 7000  },  // 3,001 - 10,000
  { name: "Advanced",     desc: "News and literature",   size: 10000 },  // 10,001 - 20,000
  { name: "Expert",       desc: "Scholarly",             size: 25000 },  // 20,001 - 45,000
  { name: "Obscure",      desc: "The long tail",         size: 40000 }   // 45,001 - 85,000
];
const PER_LEVEL = 20;
const CEILING = LEVELS.reduce((a, l) => a + l.size, 0);

/* ---------- Question bank ----------
   Entry format: [word, correct meaning, exact opposite, pair A, pair B]
   Pair A and pair B are themselves opposites of each other (usually the meanings of a similar-sounding word),
   so every question shows two opposite pairs and "find the opposite pair" never gives the answer away.
   All four options in a question are kept to a similar length so length is not a clue either. */
const BANK = [
  [ // Core
    ["abundant","existing in large supply","existing in small supply","left behind and deserted","kept and carefully guarded"],
    ["candid","truthful and outspoken","evasive and deceitful","sweet and sugar-coated","bitter and sour-tasting"],
    ["dwell","to live in a place","to leave a place","to dig a deep hole","to fill in a hole"],
    ["emerge","to come out into view","to sink out of view","to join together as one","to split apart in two"],
    ["frugal","careful about spending","careless about spending","easily broken or damaged","tough and hard to damage"],
    ["hinder","to make a task harder","to make a task easier","located at the back","located at the front"],
    ["jovial","cheerful and friendly","gloomy and unfriendly","with heavy, sagging cheeks","with thin, hollow cheeks"],
    ["lucid","clear and easy to follow","vague and hard to follow","gory and shockingly vivid","dull and lacking color"],
    ["meager","very small in amount","very large in amount","very keen and eager","very reluctant to act"],
    ["naive","lacking life experience","full of life experience","born in a given place","foreign to a given place"],
    ["obsolete","out of date and unused","brand new and in demand","complete and unlimited","partial and restricted"],
    ["peculiar","strange and unusual","normal and expected","relating to cash payment","relating to barter trade"],
    ["quench","to satisfy a thirst","to create a thirst","to ask many questions","to give many answers"],
    ["refute","to prove to be wrong","to prove to be right","to give safe shelter","to leave without shelter"],
    ["seldom","at rare intervals","at frequent intervals","in a serious manner","in a playful manner"],
    ["tedious","boring and wearisome","thrilling and gripping","hideous and repulsive","beautiful and striking"],
    ["wary","careful about danger","oblivious to danger","worn out and tired","rested and energetic"],
    ["yearn","to feel deep longing","to feel deep dislike","to be paid for work","to pay out for work"],
    ["zeal","great passion for a cause","no interest in a cause","a feeling of bitter envy","a spirit of generosity"],
    ["barren","unfit for growing crops","fit for growing crops","enclosed by a barrier","open without a barrier"],
    ["diligent","hardworking and careful","lazy and neglectful","watered down, weakened","boiled down, strengthened"],
    ["fickle","changing without warning","staying steady and fixed","pickled in salt water","served fresh and raw"],
    ["hoax","a deliberate deception","an honest, true report","a lift with a pulley","a drop with a pulley"],
    ["linger","to stay longer than needed","to leave sooner than needed","to speak in a soft voice","to shout in a sharp voice"],
    ["sturdy","solidly built and strong","loosely built and weak","fond of studying books","averse to studying books"],
    ["ample","more than sufficient","far from sufficient","a small test portion","a whole item for sale"]
  ],
  [ // Intermediate
    ["ambiguous","open to several readings","having one clear reading","highly driven to succeed","lacking the drive to win"],
    ["benign","gentle and harmless","harmful and dangerous","easy to bend or flex","stiff and unbending"],
    ["concise","short but to the point","lengthy and overloaded","guided by a moral sense","lacking a moral sense"],
    ["detrimental","causing harm or damage","bringing help or benefit","firmly set on a goal","easily swayed from goals"],
    ["elaborate","full of careful detail","plain and lacking detail","to remove all of it","to include all of it"],
    ["feasible","possible to carry out","impossible to carry out","full of festive cheer","full of solemn mourning"],
    ["gratuitous","done for no good reason","done for a sound reason","feeling deeply thankful","feeling deeply resentful"],
    ["inevitable","unavoidable and certain","avoidable and uncertain","too hidden to be seen","too obvious to miss"],
    ["mitigate","to lessen the severity","to increase the severity","to move to a new place","to remain in one place"],
    ["negligible","too small to matter","too large to ignore","failing to take care","being very careful"],
    ["prudent","careful and sensible","rash and thoughtless","shocked by impropriety","untroubled by impropriety"],
    ["reluctant","unwilling and hesitant","ready and enthusiastic","closely tied to the topic","unrelated to the topic"],
    ["scrutinize","to inspect very closely","to glance at carelessly","to crumple into a ball","to flatten out smoothly"],
    ["tentative","not yet settled or fixed","final and unchangeable","stretched tight and tense","hanging loose and slack"],
    ["volatile","likely to change fast","stable and unchanging","offered of one's own will","forced against one's will"],
    ["whimsical","playfully odd or quirky","serious and practical","crying in a low whine","shouting in a loud cheer"],
    ["alleviate","to ease pain or strain","to cause pain or strain","to raise up to a height","to bring down to a depth"],
    ["arbitrary","based on whim, not reason","based on careful reasoning","judged by a neutral umpire","judged by a biased party"],
    ["coherent","logical and consistent","muddled and contradictory","built into its nature","added on from outside"],
    ["discrepancy","a mismatch between facts","an exact match of facts","tact in what one says","tactlessness in speech"],
    ["exacerbate","to make a thing worse","to make a thing better","to cut out a section","to add in a section"],
    ["frivolous","silly and unimportant","weighty and important","icy and freezing cold","scorching and very hot"],
    ["lenient","mild when judging others","harsh when judging others","lasting a very long time","lasting a very short time"],
    ["pragmatic","sensible and realistic","dreamy and unrealistic","pumped full of air","drained of all air"],
    ["scarce","rare and hard to find","common and easy to find","easily scared or startled","hard to scare or startle"],
    ["verbose","using too many words","using too few words","spoken aloud, not written","written down, not spoken"],
    ["advocate","to publicly back a cause","to publicly attack a cause","to clear people from danger","to send people into danger"],
    ["ubiquitous","found everywhere at once","found in very few places","grossly wicked and unjust","completely fair and just"]
  ],
  [ // Advanced
    ["acrimonious","bitter and angry in tone","warm and gentle in tone","full of pomp and ritual","free of pomp and ritual"],
    ["ameliorate","to make a bad thing better","to make a bad thing worse","to blend into one whole","to split into separate bits"],
    ["capitulate","to give in and surrender","to fight on and resist","to sum up the key points","to omit the key points"],
    ["cogent","clear and convincing","vague and unconvincing","sharing a common source","sharing no common source"],
    ["copious","present in large amounts","present in small amounts","made as an exact copy","made as the original"],
    ["cursory","done quickly and lightly","done slowly and deeply","written in joined script","written in block letters"],
    ["dearth","a shortage of something","a surplus of something","the moment life ends","the moment life begins"],
    ["disparate","fundamentally different","fundamentally the same","having lost all hope","having gained new hope"],
    ["equivocal","open to two readings","having one certain sense","equal in worth or value","unequal in worth or value"],
    ["exculpate","to clear of all blame","to find guilty of blame","to dig up from earth","to bury deep in earth"],
    ["fastidious","very picky about detail","careless about detail","moving at great speed","moving at low speed"],
    ["inimical","hostile or harmful","friendly or helpful","too unique to copy","simple to copy fully"],
    ["laconic","using very few words","using very many words","famous and widely known","obscure and little known"],
    ["loquacious","tending to talk a lot","tending to talk little","lively and full of life","dull and lacking life"],
    ["mendacious","given to telling lies","given to telling truth","holding on stubbornly","releasing very easily"],
    ["munificent","very generous in giving","very stingy in giving","grand and impressive","plain and unimpressive"],
    ["obstreperous","noisy and hard to control","quiet and easy to control","blocking free passage","allowing free passage"],
    ["perfunctory","done with minimal care","done with great care","serving a useful purpose","serving no useful purpose"],
    ["propitious","favorable and promising","unfavorable and gloomy","arousing deep suspicion","inspiring deep trust"],
    ["recondite","obscure and little known","famous and widely known","put back in good order","left in bad disrepair"],
    ["salubrious","good for your health","bad for your health","tasting strongly of salt","tasting free of salt"],
    ["sycophant","a flatterer seeking favor","an open critic of rulers","a large orchestral work","a work for one player"],
    ["truculent","eager to start a fight","eager to avoid a fight","letting light pass","blocking all light"],
    ["vitriolic","bitterly harsh in speech","warmly kind in speech","clear and glass-like","dark and stone-like"]
  ],
  [ // Expert
    ["abstruse","deep and hard to grasp","plain and easy to grasp","existing only as an idea","existing in physical form"],
    ["apocryphal","of doubtful authenticity","of proven authenticity","about the world's end","about the world's start"],
    ["cavil","to make petty objections","to give lavish praise","to dig out a hollow","to fill in a hollow"],
    ["contumacious","stubbornly defying orders","willingly obeying orders","going on without a break","starting and stopping often"],
    ["desiccate","to dry out completely","to drench completely","to defile a holy place","to honor a holy place"],
    ["fulminate","to rage angrily and loudly","to approve calmly and softly","to clear a place of pests","to fill a place with pests"],
    ["impecunious","having very little money","having plenty of money","acting on sudden impulse","acting after long thought"],
    ["inchoate","just begun; not formed","fully formed and complete","completely disordered","perfectly well ordered"],
    ["insouciant","carefree and unbothered","worried and troubled","boldly rude to others","gracious and respectful"],
    ["largesse","generous gifts of money","stingy hoarding of money","the state of being huge","the state of being tiny"],
    ["obloquy","public abuse and disgrace","public praise and honor","slanting and indirect","straight and direct"],
    ["pellucid","clear and transparent","thick, dark, and murky","calm and untroubled","stormy and troubled"],
    ["perspicacious","having sharp insight","lacking any insight","clearly put into words","vaguely put into words"],
    ["pusillanimous","cowardly and fearful","bold and courageous","generous in forgiving","grudging in forgiving"],
    ["rapacious","greedy and grasping","giving and selfless","moving at high speed","moving at low speed"],
    ["sinecure","a paid post with no work","a hard job with no pay","a smooth sine wave curve","a perfectly straight line"],
    ["solipsism","belief only one mind exists","belief all minds surely exist","a gross grammar blunder","a flawless grammar model"],
    ["tendentious","pushing a biased view","giving a balanced view","extremely thin or weak","extremely thick or strong"],
    ["vituperate","to abuse in harsh words","to praise in warm words","to spoil or degrade","to improve or refine"],
    ["apotheosis","the peak or ideal example","the bottom or worst case","an idea awaiting proof","a fact proven for sure"],
    ["sedulous","diligent and dedicated","idle and neglectful","quick to believe things","slow to believe things"],
    ["prolix","tediously long-winded","refreshingly concise","producing many works","producing few works"],
    ["refulgent","radiant and shining","dull and lightless","surging up once more","sinking down once more"],
    ["recrudescence","a fresh outbreak of ills","a lasting end to ills","a state of fizzing up","a state of going flat"]
  ],
  [ // Obscure
    ["pettifogger","a lawyer using petty tricks","an honest, upright lawyer","a seller of small goods","a seller of bulk goods"],
    ["apricity","winter sun's gentle warmth","summer wind's cool chill","the first light of dawn","the last light of dusk"],
    ["petrichor","the smell of rain on soil","the smell of parched dust","turning to solid stone","crumbling stone to powder"],
    ["sphygmic","relating to the pulse","relating to total stillness","relating to the upper body","relating to the lower body"],
    ["eleemosynary","having to do with charity","having to do with profit","having to do with basics","having to do with mastery"],
    ["tmesis","a word split by a word","two words fused into one","an essay's central claim","an essay's main objection"],
    ["limerence","intense romantic obsession","calm platonic friendship","a comic five-line poem","a solemn epic-length poem"],
    ["pareidolia","seeing faces in clouds","not knowing familiar faces","needless fear of plots","naive trust of everyone"],
    ["sempiternal","lasting for all time","lasting a brief time","of or like a mother","of or like a father"],
    ["thaumaturge","a worker of miracles","a debunker of miracles","one who melts things","one who freezes things"],
    ["velleity","a weak, unacted wish","a strong, acted-on desire","speed in one direction","a state of total rest"],
    ["usufruct","the right to use property","full ownership of property","high-interest money lending","interest-free money lending"],
    ["zugzwang","a forced move that hurts","a forced move that helps","a sweet German pastry","a savory German sausage"],
    ["cacodemon","a wicked, evil spirit","a gentle, good spirit","a harsh jumble of sound","a sweet blend of sound"],
    ["hebetude","dullness of the mind","sharpness of the mind","a state of great joy","a state of deep misery"],
    ["mansuetude","gentleness and meekness","harshness and violence","a large, grand house","a small, humble hut"],
    ["oneiric","having to do with dreams","having to do with waking","saying the exact reverse","saying just what is meant"],
    ["paronomasia","a pun; a play on words","a plain literal statement","a sweeping scenic view","a narrow close-up view"],
    ["susurrus","a soft whispering sound","a deafening loud roar","a thin, high wispy cloud","a thick, low heavy cloud"],
    ["rhadamanthine","severely strict and just","lenient and easily swayed","extremely hard and firm","extremely soft and weak"],
    ["sciolist","a shallow pretend expert","a deep genuine expert","one who performs alone","one who performs in groups"],
    ["tenebrous","dark, dim, and shadowy","bright, sunny, and clear","soft, gentle, and tender","hard, rough, and tough"],
    ["hapax legomenon","a word recorded only once","a word found in every text","a fortunate chance event","an unfortunate chance event"],
    ["ultramontane","favoring papal supremacy","opposing papal supremacy","living high in mountains","living deep in valleys"]
  ]
].map(level => level.map(([word, correct, ...wrong]) => ({ word, correct, wrong })));

/* ---------- Helpers ---------- */
const $app = document.getElementById("app");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => n.toLocaleString("en-US");
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") e.className = props[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), props[k]);
    else if (k === "style") e.setAttribute("style", props[k]);
    else e[k] = props[k];
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- State ---------- */
let best = store.get("lexicount.best", 0);
let known = new Set(store.get("lexicount.known", []));
let screen = "start";
let G = null; // game state
let modal = false;

function newGame() {
  G = {
    level: 0, idx: 0,
    qs: pickQuestions(0),
    tally: LEVELS.map(() => ({ c: 0, w: 0, s: 0 })),
    selected: null, checked: false, skipped: false,
    newWords: 0
  };
}
function pickQuestions(level) {
  return shuffle(BANK[level]).slice(0, PER_LEVEL).map(({ word, correct, wrong }) => ({ word, correct, options: shuffle([correct, ...wrong]) }));
}

/* ---------- Scoring ---------- */
// Correction for guessing on 4-option questions: net = correct - wrong/3. "Not sure" answers carry no penalty.
function levelRatio(t) { return Math.max(0, t.c - t.w / 3) / PER_LEVEL; }
function estimate() { return Math.round(LEVELS.reduce((sum, l, i) => sum + levelRatio(G.tally[i]) * l.size, 0)); }

/* ---------- Actions ---------- */
function start() { newGame(); screen = "quiz"; render(); }
function choose(opt) { if (G.checked) return; G.selected = opt; render(); }
function check() { if (G.selected == null) return; G.checked = true; G.skipped = false; render(); }
function dontKnow() { if (G.checked) return; G.selected = null; G.checked = true; G.skipped = true; render(); }
function next() {
  const q = G.qs[G.idx], t = G.tally[G.level];
  if (G.skipped) t.s++;
  else if (G.selected === q.correct) { t.c++; if (!known.has(q.word)) { known.add(q.word); G.newWords++; } }
  else t.w++;
  G.selected = null; G.checked = false; G.skipped = false;
  if (G.idx < PER_LEVEL - 1) G.idx++;
  else if (G.level < LEVELS.length - 1) { G.level++; G.idx = 0; G.qs = pickQuestions(G.level); }
  else { finish(); return; }
  render();
}
function finish() {
  const est = estimate();
  G.est = est; G.isBest = best > 0 && est > best;
  if (est > best) { best = est; store.set("lexicount.best", best); }
  store.set("lexicount.known", Array.from(known));
  screen = "result"; render();
}

/* ---------- Views ---------- */
function startView() {
  const stats = [];
  if (best > 0) stats.push(el("div", { class: "stat" }, el("small", null, "Best estimate"), el("b", null, fmt(best))));
  if (known.size > 0) stats.push(el("div", { class: "stat" }, el("small", null, "Words learned"), el("b", null, fmt(known.size))));
  return el("div", { class: "wrap center" },
    el("div", { class: "logo" }, "\u{1F989}"),
    el("h1", null, "Lexicount"),
    el("div", { class: "badge" }, "Vocabulary Size Test"),
    stats.length ? el("div", { class: "stats" }, stats) : null,
    el("p", { class: "lead" }, "How many English words do you actually know? Answer 100 questions across five difficulty bands to find out."),
    el("div", { style: "width:100%" },
      el("button", { class: "btn", onclick: start }, "Reveal my word count"),
      el("button", { class: "link", onclick: () => { modal = true; render(); } }, "How it works")
    )
  );
}

function footerView() {
  const a = (href, text) => el("a", { href, target: "_blank", rel: "noopener noreferrer" }, text);
  return el("footer", { class: "credit" },
    el("p", null, "Lexicount is a fan-made backup of ", el("b", null, "VocabOwl: The Scientific Word Count"), ", created by someone else. All credit for the original idea and design goes to its creator. This version is for entertainment purposes only, and its code and word bank were written from scratch."),
    el("p", null, "Original: ", a("https://vocabowl-870366514258.us-west1.run.app/", "VocabOwl"), " (may no longer be online) \u00B7 Archived copies: ", a("https://web.archive.org/web/20260622210736/https://vocabowl-870366514258.us-west1.run.app/", "Wayback Machine"), " \u00B7 ", a("https://archive.is/ONcdV", "archive.today")),
    el("p", null, "Inspired by The Rest Is Science podcast with Prof. Hannah Fry and Michael Stevens.")
  );
}

function quizView() {
  const q = G.qs[G.idx], L = LEVELS[G.level];
  const globalIdx = G.level * PER_LEVEL + G.idx, total = LEVELS.length * PER_LEVEL;
  const correct = G.checked && !G.skipped && G.selected === q.correct;

  const opts = q.options.map(o => {
    let cls = "opt";
    if (G.checked) {
      if (o === q.correct) cls += " good";
      else if (o === G.selected) cls += " bad";
      else cls += " dim";
    } else if (o === G.selected) cls += " sel";
    return el("button", { class: cls, disabled: G.checked, onclick: () => choose(o) }, o);
  });

  // The main button and the row beneath it keep the same size and position in both states,
  // so Check and Continue sit on exactly the same spot and can be clicked back to back.
  let footer;
  if (!G.checked) {
    footer = el("div", { class: "foot" },
      el("button", { class: "btn", disabled: G.selected == null, onclick: check }, "Check"),
      el("div", { class: "slot" }, el("button", { class: "link", onclick: dontKnow }, "I don't know this one"))
    );
  } else {
    const kind = G.skipped ? "skip" : correct ? "good" : "bad";
    const heading = G.skipped ? "No problem, now you know." : correct ? "Correct!" : "Not quite.";
    footer = el("div", { class: "foot" },
      el("button", { class: "btn" + (kind === "bad" ? " red" : ""), onclick: next }, "Continue"),
      el("div", { class: "slot" },
        el("div", { class: "fb " + kind },
          el("b", null, heading),
          correct ? null : el("span", null, q.word + ": " + q.correct)
        )
      )
    );
  }

  return el("div", { class: "wrap" },
    el("div", { class: "top" },
      el("div", { class: "pill" }, "Level " + (G.level + 1) + ": " + L.name),
      el("div", { class: "count" }, (globalIdx + 1) + " / " + total)
    ),
    el("div", { class: "bar" }, el("i", { style: "width:" + Math.max(3, (globalIdx / total) * 100) + "%" })),
    el("h2", null, "Select the correct meaning"),
    el("div", { class: "word" }, q.word),
    el("div", { class: "opts" }, opts),
    footer
  );
}

function verdict(n) {
  if (n < 5000) return "A splendid start. The English language is your oyster, waiting to be opened.";
  if (n < 15000) return "Jolly good. You can certainly hold your own at a dinner party.";
  if (n < 25000) return "Impressive. You probably know what an aglet is without looking it up.";
  if (n < 35000) return "Astounding. A walking thesaurus with a zest for life.";
  return "Remarkable. Are you secretly a lexicographer?";
}

function resultView() {
  const big = el("div", { class: "big" }, fmt(G.est));
  const target = G.est, dur = 1800;
  requestAnimationFrame(t0 => {
    (function tick(now) {
      const p = Math.min(1, (now - t0) / dur);
      big.textContent = fmt(Math.round(target * (1 - Math.pow(1 - p, 3))));
      if (p < 1 && big.isConnected) requestAnimationFrame(tick); else big.textContent = fmt(target);
    })(t0);
  });

  const rows = LEVELS.map((l, i) => {
    const t = G.tally[i], pct = Math.round(levelRatio(t) * 100);
    return el("div", { class: "row" },
      el("span", { class: "n" }, l.name),
      el("div", { class: "t" }, el("i", { style: "width:" + pct + "%" })),
      el("span", { class: "v" }, t.c + "/" + PER_LEVEL)
    );
  });

  return el("div", { class: "wrap", style: "align-items:center" },
    el("div", { class: "card" },
      el("div", { class: "hero" },
        G.isBest ? el("div", { class: "nb" }, "NEW BEST") : null,
        el("small", null, "Estimated vocabulary"),
        big,
        el("small", null, "words")
      ),
      el("div", { class: "body" },
        el("p", { class: "verdict" }, "\u201C" + verdict(G.est) + "\u201D"),
        G.newWords > 0 ? el("p", { class: "note", style: "margin:0 0 14px" }, "You learned or confirmed " + G.newWords + " new word" + (G.newWords === 1 ? "" : "s") + " this round.") : null,
        el("div", { class: "break" }, el("h3", null, "Performance breakdown"), rows,
          el("p", { class: "note" }, "Rough estimate. Typical native adults land between about 20,000 and 35,000 words."))
      )
    ),
    el("div", { style: "width:100%" },
      el("button", { class: "btn", onclick: start }, "Try again"),
      el("button", { class: "link", style: "width:100%", onclick: () => { modal = true; render(); } }, "How is this calculated?")
    )
  );
}

function modalView() {
  const close = () => { modal = false; render(); };
  const table = el("table", null, LEVELS.map(l => el("tr", null, el("td", null, l.name + " (" + l.desc.toLowerCase() + ")"), el("td", null, fmt(l.size)))));
  return el("div", { class: "modal", onclick: e => { if (e.target.classList.contains("modal")) close(); } },
    el("div", { class: "sheet" },
      el("h3", null, "How it works"),
      el("p", null, "The test splits the vocabulary into five bands, from everyday words to the rare long tail. You answer " + PER_LEVEL + " multiple-choice questions from each band, so your result reflects how far down the frequency ladder your knowledge reaches."),
      el("h4", null, "Bands"),
      table,
      el("p", null, "Together the bands cover about " + fmt(CEILING) + " words, a practical ceiling rather than a full dictionary count."),
      el("h4", null, "Calculation"),
      el("p", null, "For each band, the share of words you know is estimated as (correct minus one third of wrong answers) divided by " + PER_LEVEL + ". The deduction cancels out lucky guesses on four-option questions. Choosing \"I don't know\" costs nothing. Each share is multiplied by the band size and the results are summed."),
      el("h4", null, "Limits"),
      el("p", null, "Twenty questions per band gives a noisy estimate, so treat the number as a ballpark and expect a few thousand words of swing between attempts. Questions come from a hand-written bank, so repeat attempts will see repeated words."),
      el("h4", null, "Credit"),
      el("p", null, "This is a fan-made backup of VocabOwl, the Scientific Word Count, which was created by someone else. The original idea and design belong to its creator, and this version is for entertainment purposes only. The code and word bank here were written from scratch."),
      el("button", { class: "btn", style: "margin-top:14px", onclick: close }, "Got it")
    )
  );
}

function render() {
  $app.replaceChildren(screen === "start" ? startView() : screen === "quiz" ? quizView() : resultView(), footerView());
  if (modal) $app.append(modalView());
}
render();
</script>
</body>
</html>
