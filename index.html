<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexicount - Vocabulary Size Test</title>
<style>
:root{
  --bg:#ffffff;--fg:#374151;--muted:#6b7280;--soft:#f3f4f6;--line:#e5e7eb;
  --green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--blue-d:#1899d6;
  --red:#ff4b4b;--red-d:#ea2b2b;--yellow:#ffc800;--card:#ffffff;
  --good-bg:#e7f8d4;--bad-bg:#ffe1e1;--sel-bg:#dff3fd;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#131f24;--fg:#e5e7eb;--muted:#9ca3af;--soft:#1f2c33;--line:#37464f;--card:#1a282f;
  --good-bg:#233a14;--bad-bg:#4a1f1f;--sel-bg:#12384d}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:520px;padding:24px 20px;flex:1;display:flex;flex-direction:column}
.center{align-items:center;justify-content:center;text-align:center}
h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:8px 0}
h2{font-size:26px;font-weight:800;margin:0 0 12px}
.badge{display:inline-block;background:#fef9c3;color:#854d0e;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:16px}
.logo{font-size:84px;line-height:1;margin-bottom:8px}
p.lead{color:var(--muted);font-weight:600;max-width:320px;line-height:1.6;margin:12px auto 28px}
.btn{font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border:0;border-bottom:4px solid var(--green-d);background:var(--green);color:#fff;padding:13px 22px;border-radius:16px;cursor:pointer;width:100%;font-size:15px}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red);border-bottom-color:var(--red-d)}
.btn.sec{background:var(--card);color:var(--blue);border:2px solid var(--line);border-bottom-width:4px}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:800;cursor:pointer;padding:12px;margin-top:6px}
.link:hover{text-decoration:underline}
.stats{display:flex;gap:12px;margin:0 0 24px;width:100%}
.stat{flex:1;border:2px solid var(--line);border-radius:14px;padding:8px;background:var(--soft)}
.stat small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pill{background:var(--soft);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:99px}
.count{color:var(--green);font-weight:800;font-size:14px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.word{background:var(--sel-bg);border:2px solid var(--blue);border-radius:18px;padding:22px 12px;text-align:center;font-size:32px;font-weight:800;margin:10px 0 22px;word-break:break-word}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;cursor:pointer;font-size:16px}
.opt:hover:not(:disabled){background:var(--soft)}
.opt.sel{background:var(--sel-bg);border-color:var(--blue)}
.opt.good{background:var(--good-bg);border-color:var(--green)}
.opt.bad{background:var(--bad-bg);border-color:var(--red)}
.opt.dim{opacity:.5}
.foot{margin-top:auto;padding-top:20px}
.fb{border-radius:16px;padding:16px;margin-top:6px}
.fb.good{background:var(--good-bg)}.fb.bad{background:var(--bad-bg)}.fb.skip{background:var(--soft)}
.fb b{display:block;font-size:19px;margin-bottom:4px}
.fb span{display:block;margin-bottom:12px;font-weight:600}
.card{width:100%;border:2px solid var(--line);border-bottom-width:8px;border-radius:24px;overflow:hidden;background:var(--card);margin-bottom:18px;text-align:center}
.hero{background:var(--blue);color:#fff;padding:24px 16px}
.hero small{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hero .big{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .nb{display:inline-block;background:var(--yellow);color:#713f12;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;margin-bottom:8px}
.body{padding:20px}
.verdict{font-style:italic;font-weight:700;font-size:18px;line-height:1.4;margin:0 0 18px}
.break{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.break h3{margin:0 0 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;font-size:13px;margin:8px 0;font-weight:700}
.row .n{width:84px}.row .t{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.row .t i{display:block;height:100%;background:var(--green)}
.row .v{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);width:46px;text-align:right}
.credit{font-size:11px;line-height:1.5;color:var(--muted);font-weight:600;max-width:460px;margin:8px auto 0;padding:16px 20px 28px;text-align:center;border-top:1px solid var(--line);width:100%}
.credit p{margin:0 0 6px}
.credit a{color:var(--blue)}
.note{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--card);color:var(--fg);border-radius:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.sheet h3{margin:0 0 10px;font-size:20px}
.sheet h4{margin:18px 0 6px}
.sheet p,.sheet li{font-size:14px;line-height:1.6;color:var(--muted);font-weight:600}
.sheet ul{padding-left:18px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet td{padding:6px 8px;border-bottom:1px solid var(--line)}
.sheet td:last-child{text-align:right;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ---------- Configuration ---------- */
// Each band is a slice of the frequency-ranked vocabulary. size = number of words the band represents.
const LEVELS = [
  { name: "Core",         desc: "Everyday words",        size: 3000  },  // ranks 1 - 3,000
  { name: "Intermediate", desc: "School and work",       size: 5000  },  // 3,001 - 8,000
  { name: "Advanced",     desc: "News and literature",   size: 12000 },  // 8,001 - 20,000
  { name: "Expert",       desc: "Scholarly",             size: 20000 },  // 20,001 - 40,000
  { name: "Obscure",      desc: "The long tail",         size: 30000 }   // 40,001 - 70,000
];
const PER_LEVEL = 20;
const CEILING = LEVELS.reduce((a, l) => a + l.size, 0);

/* ---------- Question bank: [word, correct meaning, 3 wrong meanings] ---------- */
const BANK = [
  [ // Core
    ["abundant","plentiful","very rare","carefully hidden","extremely old"],
    ["candid","honest and direct","secretive","sugary","clumsy"],
    ["dwell","to live in a place","to hurry along","to argue loudly","to hide away"],
    ["emerge","to come into view","to fade away","to sink down","to mix together"],
    ["frugal","careful with money","wasteful","very generous","greedy"],
    ["hinder","to get in the way of","to assist","to notice","to repeat"],
    ["jovial","cheerful and friendly","angry","sleepy","wealthy"],
    ["lucid","clear and easy to follow","confusing","dark","sticky"],
    ["meager","small in amount","huge","colorful","heavy"],
    ["naive","lacking experience","very wise","physically strong","tired"],
    ["obsolete","no longer in use","brand new","fragile","very popular"],
    ["peculiar","odd or unusual","ordinary","soft","bright green"],
    ["quench","to satisfy a thirst","to light a fire","to build quickly","to ignore"],
    ["refute","to prove wrong","to agree with","to write down","to shout at"],
    ["seldom","rarely","every day","loudly","gladly"],
    ["tedious","boring and tiresome","thrilling","tasty","very short"],
    ["wary","cautious","careless","sleepy","cheerful"],
    ["yearn","to long for","to hate","to throw away","to leap over"],
    ["zeal","great enthusiasm","laziness","fear","sorrow"],
    ["barren","unable to support plants","lush","crowded","damp"],
    ["diligent","hardworking","lazy","lucky","reckless"],
    ["fickle","changing often","steady","rigid","very fast"],
    ["gloom","partial darkness","bright sunshine","loud noise","sweet scent"],
    ["hoax","a deliberate trick","a proven fact","a long trip","a heavy tool"],
    ["linger","to stay longer than needed","to leave at once","to sprint","to stumble"],
    ["mend","to repair","to break","to discard","to purchase"],
    ["sturdy","strongly built","flimsy","tiny","noisy"],
    ["ample","more than enough","not nearly enough","slightly bent","very old"]
  ],
  [ // Intermediate
    ["ambiguous","open to more than one meaning","clearly stated","extremely loud","very ambitious"],
    ["benign","harmless","deadly","secret","ancient"],
    ["concise","brief but clear","long and rambling","rude","hidden"],
    ["detrimental","harmful","helpful","decorative","temporary"],
    ["elaborate","detailed and complex","plain","swift","silent"],
    ["feasible","possible to do","forbidden","edible","festive"],
    ["gratuitous","uncalled for","deeply thankful","carefully planned","highly profitable"],
    ["inevitable","certain to happen","unlikely","invisible","pleasant"],
    ["mitigate","to make less severe","to make worse","to measure","to move away"],
    ["negligible","too small to matter","very large","easily negotiated","quick to anger"],
    ["prudent","wise and careful","rash","stingy","proud"],
    ["reluctant","unwilling","eager","tired","relevant"],
    ["scrutinize","to examine closely","to glance at","to scratch","to forget"],
    ["tentative","not yet certain","firm and final","loud and brash","very tense"],
    ["volatile","liable to change rapidly","stable","dull and slow","very tasty"],
    ["whimsical","playfully unpredictable","solemn","fragile","wealthy"],
    ["alleviate","to ease","to intensify","to ignore","to praise"],
    ["arbitrary","based on whim, not reason","carefully reasoned","legally binding","two-sided"],
    ["coherent","logical and consistent","scattered","cold","heavy"],
    ["discrepancy","a mismatch between facts","a full agreement","a disguise","a short break"],
    ["exacerbate","to make worse","to improve","to excuse","to hurry"],
    ["frivolous","not serious","very important","frightened","frozen"],
    ["lenient","mild in punishment","harsh","lengthy","lonely"],
    ["pragmatic","practical","dreamy","pompous","poetic"],
    ["scarce","in short supply","plentiful","frightening","sharp"],
    ["verbose","using too many words","silent","truthful","rude"],
    ["advocate","to publicly support","to oppose","to postpone","to calculate"],
    ["ubiquitous","found everywhere","extremely rare","very expensive","hidden from view"]
  ],
  [ // Advanced
    ["acrimonious","bitter and angry","cheerful","extremely tall","done in secret"],
    ["ameliorate","to make better","to make worse","to amuse","to sell"],
    ["capitulate","to surrender","to take charge","to capture","to count"],
    ["cogent","clear and convincing","confused","tiny","cold"],
    ["copious","abundant","scarce","secret","noisy"],
    ["cursory","hasty and superficial","thorough","angry","ancient"],
    ["dearth","a scarcity","an abundance","a celebration","a tool"],
    ["disparate","fundamentally different","closely alike","deeply sad","freely given"],
    ["equivocal","deliberately ambiguous","perfectly clear","evenly balanced","very honest"],
    ["exculpate","to clear of blame","to accuse","to dig out","to breathe out"],
    ["fastidious","hard to please","careless","rapid","greasy"],
    ["inimical","hostile","friendly","identical","endless"],
    ["laconic","using very few words","very talkative","sad","lazy"],
    ["loquacious","talkative","silent","clumsy","wealthy"],
    ["mendacious","untruthful","repairing","beggarly","wise"],
    ["munificent","very generous","stingy","magnificent in size","musical"],
    ["obstreperous","noisy and unruly","quiet and obedient","hard to see","very thin"],
    ["perfunctory","done without real care","done with great care","extremely fragrant","very quick"],
    ["propitious","favorable","unlucky","proper","pious"],
    ["recondite","little known and obscure","widely famous","freshly made","very bitter"],
    ["salubrious","health-giving","sorrowful","salty","very dirty"],
    ["sycophant","a flatterer seeking favor","a wise advisor","a type of tree","a harsh critic"],
    ["truculent","eager to fight","timid","tasty","truthful"],
    ["vitriolic","bitterly harsh","mildly pleasant","glassy","very small"]
  ],
  [ // Expert
    ["abstruse","difficult to understand","easy to grasp","brief","hungry"],
    ["apocryphal","of doubtful authenticity","fully verified","holy and sacred","very ancient"],
    ["cavil","to raise petty objections","to cheer loudly","to dig a cave","to carve wood"],
    ["contumacious","stubbornly disobedient","very polite","filled with pride","extremely sleepy"],
    ["desiccate","to dry out completely","to cut into pieces","to decorate","to flood"],
    ["fulminate","to protest loudly and angrily","to lightly cook","to stir gently","to flatter"],
    ["impecunious","having very little money","extremely wealthy","unable to speak","not yet born"],
    ["inchoate","just begun and not fully formed","fully developed","very cold","dishonest"],
    ["insouciant","casually carefree","deeply worried","very insulting","easily broken"],
    ["largesse","generous giving","great size","a type of fabric","a long speech"],
    ["obloquy","public abuse or disgrace","a long poem","a type of mirror","a slanted line"],
    ["pellucid","transparently clear","muddy","sticky","very rare"],
    ["perspicacious","having keen insight","dripping with sweat","very stubborn","hard to please"],
    ["pusillanimous","cowardly","very tiny","extremely kind","unusually loud"],
    ["rapacious","grasping and greedy","very fast","gentle","musical"],
    ["sinecure","a paid job with little work","a medical remedy","a type of knot","a strict rule"],
    ["solipsism","the view that only one's own mind is sure to exist","a belief in many gods","a fear of crowds","love of solitude in nature"],
    ["tendentious","promoting a particular point of view","very gentle","related to muscles","extremely brief"],
    ["vituperate","to berate abusively","to praise warmly","to vote repeatedly","to cook slowly"],
    ["apotheosis","the highest point or ideal example","a sudden collapse","a small mistake","a type of medicine"],
    ["sedulous","persistently diligent","very sleepy","filled with sugar","hard to see"],
    ["prolix","tediously long-winded","very short","greasy","shiny"],
    ["refulgent","shining brightly","falling apart","very cold","slow to react"],
    ["recrudescence","a renewed outbreak","a gradual decline","a type of glow","a legal ruling"]
  ],
  [ // Obscure
    ["pettifogger","a lawyer who uses petty tricks","a small frog","a person who grows tiny plants","a fussy cook"],
    ["apricity","the warmth of the sun in winter","a type of fruit tree","extreme honesty","fear of heights"],
    ["petrichor","the smell of rain on dry earth","a type of rock oil","a stone carver","a bitter herb"],
    ["sphygmic","relating to the pulse","relating to sphinxes","relating to spiders","relating to sound waves"],
    ["eleemosynary","relating to charity","relating to elephants","relating to electricity","relating to elegant speech"],
    ["tmesis","the splitting of a word by inserting another word","a type of rare tea","a fear of darkness","a metal alloy"],
    ["limerence","an involuntary state of intense romantic infatuation","a type of poem","a citrus fruit","a legal boundary"],
    ["pareidolia","seeing faces or patterns in random shapes","a fear of parents","a type of ancient pottery","a mild paralysis"],
    ["sempiternal","eternal","half-finished","very tidy","seasonal"],
    ["thaumaturge","a worker of miracles","a type of jar","a tax collector","a deep sea diver"],
    ["velleity","a mere wish with no effort to act","a fast bicycle","a woolly fabric","a sudden fever"],
    ["usufruct","the legal right to use another's property","a rotten fruit","a type of grain","a fruitful harvest"],
    ["zugzwang","a position where any move makes things worse","a sudden gust of wind","a type of sausage","a surprise attack"],
    ["cacodemon","an evil spirit","a bad singer","a type of cactus","a chemical solvent"],
    ["hebetude","mental dullness","great height","a type of hinge","a youthful glow"],
    ["mansuetude","gentleness","a great mansion","manual skill","male vanity"],
    ["oneiric","relating to dreams","relating to onions","relating to unity","relating to ownership"],
    ["paronomasia","a pun","a wide view","a fear of neighbors","a type of fern"],
    ["quiddity","the essential nature of a thing","a game with brooms","a quiet tendency","a type of small bird"],
    ["rhadamanthine","rigorously strict and just","related to rhubarb","made of rhododendrons","fond of rhyme"],
    ["sciolist","a person with only superficial knowledge","a student of soil","a skilled glassmaker","a lover of sunshine"],
    ["tenebrous","dark and shadowy","stubbornly firm","related to tennis","very thin"],
    ["hapax legomenon","a word recorded only once in a corpus","a six-sided figure","a very long legal term","a type of Greek dance"],
    ["ultramontane","favoring strong papal authority","living high in the mountains","extremely modern","related to the sea"]
  ]
];

/* ---------- Helpers ---------- */
const $app = document.getElementById("app");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => n.toLocaleString("en-US");
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") e.className = props[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), props[k]);
    else if (k === "style") e.setAttribute("style", props[k]);
    else e[k] = props[k];
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- State ---------- */
let best = store.get("lexicount.best", 0);
let known = new Set(store.get("lexicount.known", []));
let screen = "start";
let G = null; // game state
let modal = false;

function newGame() {
  G = {
    level: 0, idx: 0,
    qs: pickQuestions(0),
    tally: LEVELS.map(() => ({ c: 0, w: 0, s: 0 })),
    selected: null, checked: false, skipped: false,
    newWords: 0
  };
}
function pickQuestions(level) {
  return shuffle(BANK[level]).slice(0, PER_LEVEL).map(([word, correct, ...wrong]) => ({ word, correct, options: shuffle([correct, ...wrong]) }));
}

/* ---------- Scoring ---------- */
// Correction for guessing on 4-option questions: net = correct - wrong/3. "Not sure" answers carry no penalty.
function levelRatio(t) { return Math.max(0, t.c - t.w / 3) / PER_LEVEL; }
function estimate() { return Math.round(LEVELS.reduce((sum, l, i) => sum + levelRatio(G.tally[i]) * l.size, 0)); }

/* ---------- Actions ---------- */
function start() { newGame(); screen = "quiz"; render(); }
function choose(opt) { if (G.checked) return; G.selected = opt; render(); }
function check() { if (G.selected == null) return; G.checked = true; G.skipped = false; render(); }
function dontKnow() { if (G.checked) return; G.selected = null; G.checked = true; G.skipped = true; render(); }
function next() {
  const q = G.qs[G.idx], t = G.tally[G.level];
  if (G.skipped) t.s++;
  else if (G.selected === q.correct) { t.c++; if (!known.has(q.word)) { known.add(q.word); G.newWords++; } }
  else t.w++;
  G.selected = null; G.checked = false; G.skipped = false;
  if (G.idx < PER_LEVEL - 1) G.idx++;
  else if (G.level < LEVELS.length - 1) { G.level++; G.idx = 0; G.qs = pickQuestions(G.level); }
  else { finish(); return; }
  render();
}
function finish() {
  const est = estimate();
  G.est = est; G.isBest = best > 0 && est > best;
  if (est > best) { best = est; store.set("lexicount.best", best); }
  store.set("lexicount.known", Array.from(known));
  screen = "result"; render();
}

/* ---------- Views ---------- */
function startView() {
  const stats = [];
  if (best > 0) stats.push(el("div", { class: "stat" }, el("small", null, "Best estimate"), el("b", null, fmt(best))));
  if (known.size > 0) stats.push(el("div", { class: "stat" }, el("small", null, "Words learned"), el("b", null, fmt(known.size))));
  return el("div", { class: "wrap center" },
    el("div", { class: "logo" }, "\u{1F989}"),
    el("h1", null, "Lexicount"),
    el("div", { class: "badge" }, "Vocabulary Size Test"),
    stats.length ? el("div", { class: "stats" }, stats) : null,
    el("p", { class: "lead" }, "How many English words do you actually know? Answer 100 questions across five difficulty bands to find out."),
    el("div", { style: "width:100%" },
      el("button", { class: "btn", onclick: start }, "Reveal my word count"),
      el("button", { class: "link", onclick: () => { modal = true; render(); } }, "How it works")
    )
  );
}

function footerView() {
  const a = (href, text) => el("a", { href, target: "_blank", rel: "noopener noreferrer" }, text);
  return el("footer", { class: "credit" },
    el("p", null, "Lexicount is a fan-made backup of ", el("b", null, "VocabOwl: The Scientific Word Count"), ", created by someone else. All credit for the original idea and design goes to its creator. This version is for entertainment purposes only, and its code and word bank were written from scratch."),
    el("p", null, "Original: ", a("https://vocabowl-870366514258.us-west1.run.app/", "VocabOwl"), " (may no longer be online) \u00B7 Archived copies: ", a("https://web.archive.org/web/20260622210736/https://vocabowl-870366514258.us-west1.run.app/", "Wayback Machine"), " \u00B7 ", a("https://archive.is/ONcdV", "archive.today")),
    el("p", null, "Inspired by The Rest Is Science podcast with Prof. Hannah Fry and Michael Stevens.")
  );
}

function quizView() {
  const q = G.qs[G.idx], L = LEVELS[G.level];
  const globalIdx = G.level * PER_LEVEL + G.idx, total = LEVELS.length * PER_LEVEL;
  const correct = G.checked && !G.skipped && G.selected === q.correct;

  const opts = q.options.map(o => {
    let cls = "opt";
    if (G.checked) {
      if (o === q.correct) cls += " good";
      else if (o === G.selected) cls += " bad";
      else cls += " dim";
    } else if (o === G.selected) cls += " sel";
    return el("button", { class: cls, disabled: G.checked, onclick: () => choose(o) }, o);
  });

  let footer;
  if (!G.checked) {
    footer = el("div", { class: "foot" },
      el("button", { class: "btn", disabled: G.selected == null, onclick: check }, "Check"),
      el("button", { class: "link", style: "width:100%", onclick: dontKnow }, "I don't know this one")
    );
  } else {
    const kind = G.skipped ? "skip" : correct ? "good" : "bad";
    const heading = G.skipped ? "No problem, now you know." : correct ? "Correct!" : "Not quite.";
    footer = el("div", { class: "foot" },
      el("div", { class: "fb " + kind },
        el("b", null, heading),
        correct ? null : el("span", null, q.word + ": " + q.correct),
        el("button", { class: "btn" + (kind === "bad" ? " red" : ""), onclick: next }, "Continue")
      )
    );
  }

  return el("div", { class: "wrap" },
    el("div", { class: "top" },
      el("div", { class: "pill" }, "Level " + (G.level + 1) + ": " + L.name),
      el("div", { class: "count" }, (globalIdx + 1) + " / " + total)
    ),
    el("div", { class: "bar" }, el("i", { style: "width:" + Math.max(3, (globalIdx / total) * 100) + "%" })),
    el("h2", null, "Select the correct meaning"),
    el("div", { class: "word" }, q.word),
    el("div", { class: "opts" }, opts),
    footer
  );
}

function verdict(n) {
  if (n < 5000) return "A splendid start. The English language is your oyster, waiting to be opened.";
  if (n < 15000) return "Jolly good. You can certainly hold your own at a dinner party.";
  if (n < 25000) return "Impressive. You probably know what an aglet is without looking it up.";
  if (n < 35000) return "Astounding. A walking thesaurus with a zest for life.";
  return "Remarkable. Are you secretly a lexicographer?";
}

function resultView() {
  const big = el("div", { class: "big" }, "0");
  const target = G.est, t0 = performance.now(), dur = 1800;
  (function tick(now) {
    const p = Math.min(1, (now - t0) / dur);
    big.textContent = fmt(Math.round(target * (1 - Math.pow(1 - p, 3))));
    if (p < 1 && big.isConnected !== false) requestAnimationFrame(tick);
  })(t0);

  const rows = LEVELS.map((l, i) => {
    const t = G.tally[i], pct = Math.round(levelRatio(t) * 100);
    return el("div", { class: "row" },
      el("span", { class: "n" }, l.name),
      el("div", { class: "t" }, el("i", { style: "width:" + pct + "%" })),
      el("span", { class: "v" }, t.c + "/" + PER_LEVEL)
    );
  });

  return el("div", { class: "wrap", style: "align-items:center" },
    el("div", { class: "card" },
      el("div", { class: "hero" },
        G.isBest ? el("div", { class: "nb" }, "NEW BEST") : null,
        el("small", null, "Estimated vocabulary"),
        big,
        el("small", null, "words")
      ),
      el("div", { class: "body" },
        el("p", { class: "verdict" }, "\u201C" + verdict(G.est) + "\u201D"),
        G.newWords > 0 ? el("p", { class: "note", style: "margin:0 0 14px" }, "You learned or confirmed " + G.newWords + " new word" + (G.newWords === 1 ? "" : "s") + " this round.") : null,
        el("div", { class: "break" }, el("h3", null, "Performance breakdown"), rows,
          el("p", { class: "note" }, "Rough estimate. Typical native adults land between about 20,000 and 35,000 words."))
      )
    ),
    el("div", { style: "width:100%" },
      el("button", { class: "btn", onclick: start }, "Try again"),
      el("button", { class: "link", style: "width:100%", onclick: () => { modal = true; render(); } }, "How is this calculated?")
    )
  );
}

function modalView() {
  const close = () => { modal = false; render(); };
  const table = el("table", null, LEVELS.map(l => el("tr", null, el("td", null, l.name + " (" + l.desc.toLowerCase() + ")"), el("td", null, fmt(l.size)))));
  return el("div", { class: "modal", onclick: e => { if (e.target.classList.contains("modal")) close(); } },
    el("div", { class: "sheet" },
      el("h3", null, "How it works"),
      el("p", null, "The test splits the vocabulary into five bands, from everyday words to the rare long tail. You answer " + PER_LEVEL + " multiple-choice questions from each band, so your result reflects how far down the frequency ladder your knowledge reaches."),
      el("h4", null, "Bands"),
      table,
      el("p", null, "Together the bands cover about " + fmt(CEILING) + " words, a practical ceiling rather than a full dictionary count."),
      el("h4", null, "Calculation"),
      el("p", null, "For each band, the share of words you know is estimated as (correct minus one third of wrong answers) divided by " + PER_LEVEL + ". The deduction cancels out lucky guesses on four-option questions. Choosing \"I don't know\" costs nothing. Each share is multiplied by the band size and the results are summed."),
      el("h4", null, "Limits"),
      el("p", null, "Twenty questions per band gives a noisy estimate, so treat the number as a ballpark and expect a few thousand words of swing between attempts. Questions come from a hand-written bank, so repeat attempts will see repeated words."),
      el("h4", null, "Credit"),
      el("p", null, "This is a fan-made backup of VocabOwl, the Scientific Word Count, which was created by someone else. The original idea and design belong to its creator, and this version is for entertainment purposes only. The code and word bank here were written from scratch."),
      el("button", { class: "btn", style: "margin-top:14px", onclick: close }, "Got it")
    )
  );
}

function render() {
  $app.replaceChildren(screen === "start" ? startView() : screen === "quiz" ? quizView() : resultView(), footerView());
  if (modal) $app.append(modalView());
}
render();
</script>
</body>
</html>
